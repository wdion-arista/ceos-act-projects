name: Build and Publish containers/base Image

on:
  push:
    branches:
      - '**'
    paths:
      - 'containers/base/**'
  release:
    types: [published]

env:
  IMAGE: ghcr.io/${{ github.repository }}/base

jobs:
  # ------------------------------------------------------------------
  # DEV JOB: branch builds — tagged with branch name
  # ------------------------------------------------------------------
  build-and-push-dev:
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: containers/base
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            GH_USERNAME=${{ github.actor }}

  # ------------------------------------------------------------------
  # MAIN JOB: merged to main — tagged latest
  # ------------------------------------------------------------------
  build-and-push-main:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: containers/base
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            GH_USERNAME=${{ github.actor }}

  # ------------------------------------------------------------------
  # RELEASE JOB: GitHub release published — retag latest with version
  # ------------------------------------------------------------------
  tag-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull ${{ env.IMAGE }}:latest

      - name: Tag with release version
        run: |
          docker tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.event.release.tag_name }}

      - name: Push release tag
        run: docker push ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
