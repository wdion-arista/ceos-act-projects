name: Build and Publish Docker Image

env:
  AVD_VERSION: "5.6.0"
  DOCKER_GID: 2020

on:
  push:
    branches:
      - '**'
    paths:
      - 'docker/**'
    # paths-ignore:
    #   - '.dev.container/**'

jobs:
  # ------------------------------------------------------------------
  # DEV JOB: 
  # ------------------------------------------------------------------
  build-and-push-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: ${{ github.ref_name != 'main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [FIX 1] Essential for multi-arch builds (AMD64 + ARM64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: semgrep scan --config auto
        env:
          SEMGREP_RULES: p/ci p/security-audit p/secrets p/xss

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: docker/.
          push: true
          # [FIX 2] Added platforms here so OrbStack (Mac) gets the native ARM64 image
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            GH_USERNAME=${{ github.actor }}
            AVD_VERSION=${{ env.AVD_VERSION }}
            DOCKER_GID=${{ env.DOCKER_GID }}
          secrets: |
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # MAIN JOB: 
  # ------------------------------------------------------------------
  build-and-push-main:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # [FIX 3] Added these steps here too, or the 'platforms' flag below might fail
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: semgrep scan --config auto
        env:
          SEMGREP_RULES: p/ci p/security-audit p/secrets p/xss

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: docker/.
          # This was already here, but now it will actually work because of FIX 3
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:latest
          build-args: |
            GH_USERNAME=${{ github.actor }}
            AVD_VERSION=${{ env.AVD_VERSION }}
          secrets: |
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}