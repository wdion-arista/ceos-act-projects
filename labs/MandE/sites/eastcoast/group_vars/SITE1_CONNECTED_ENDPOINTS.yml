          - SW101-SITE1-B
          - SW101-SITE1-B
          - SW101-SITE1-B
          - SW101-SITE1-B
          - SW101-SITE1-B
        descriptions: 
          - Haivison Gateway-NIC1
          - Haivison Encoder 101-NIC1
          - Haivison Encoder 102-NIC1
          - Haivison Decoder 11-NIC1
          - Haivison Decoder 12-NIC1
        profile: HaivisionSRTTrafficBlue_site1
# SITE5aki
  - name: SITE5akiBlue-Transit
    adapters:
      - switch_ports:
          - Ethernet19
        switches: 
          - SW101-SITE1-B
        descriptions: 
          - SITE5aki FW 100-Port9
        profile: SITE5AKI_TRANSIT
