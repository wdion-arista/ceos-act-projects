##############################################
# Switchport config for SW101-SITE1-B

# JXSVideoTraffic
  - name: JXSVideoTrafficBlue
    # Definition of adapters on the server.
    adapters:
      - switch_ports:
          - Ethernet1
          - Ethernet2
          - Ethernet3
          - Ethernet9
          - Ethernet23
        switches: 
          - SW101-SITE1-B
          - SW101-SITE1-B
          - SW101-SITE1-B
          - SW101-SITE1-B
          - SW101-SITE1-B
        descriptions: 
          - Appear JPEG XS Kit 1 Sw 1 D1
          - Appear JPEG XS Kit 1 Sw 1 D2
          - SFP Populated for BU
          - TAG Multiviewer	NIC 1
          - Evertz 7890 MG	Trunk A
        profile: JXSVideoTrafficBlue_site1
    
# Haivision
  - name: HaivisionSRTTrafficBlue
    adapters:
      - switch_ports:
          - Ethernet11
          - Ethernet12
          - Ethernet13
          - Ethernet14
          - Ethernet15
