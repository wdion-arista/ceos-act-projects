- name: Setup IP_forwarding
  hosts: SERVERS
  become: true
  gather_facts: true

  tasks:
    # - name: Install update (Can take +10 mins)
    #   ansible.builtin.command: sudo apt update -y
    #   register: task_result
    #   failed_when: task_result.rc != 0
    #   ignore_errors: true
    #   changed_when: task_result.rc != 0 # <- Uses the return code to define when the task has changed.

    - name: Install or update iperf3
      become: true
      ansible.builtin.apt:
        name:
          - iputils-ping
          - iperf3
          - iptables-persistent
          - lldpd
        state: present

    # - name: Writing ip_forward
    #   tags: [build]
    #   ansible.builtin.copy:
    #     content: "net.ipv4.ip_forward=1"
    #     dest: "/etc/sysctl.conf"
    #     mode: u=rw,g=r,o=r

    - name: Writing ip_forward
      tags: [build]
      vars:
        ansible_become: true
      ansible.builtin.blockinfile:
        path: /etc/sysctl.conf
        block: "net.ipv4.ip_forward=1"
        marker: "# {mark} ANSIBLE MANAGED INTERFACES BLOCK"
      register: ip_forward_block_result

    - name: IP set et1
      ansible.builtin.shell:
        executable: /bin/bash
        # chdir: "{{ app_folder }}"
        cmd: |
          sudo ip addr add "{{ hostvars[inventory_hostname].inband_ip }}" dev  et1
      register: et1_ip_out
      changed_when: et1_ip_out.rc
      ignore_errors: true


    - name: IP tables
      ansible.builtin.shell:
        executable: /bin/bash
        # chdir: "{{ app_folder }}"
        cmd: |
          sudo sysctl -p
          sudo iptables -t nat -A POSTROUTING -o ens4 -j MASQUERADE
          sudo iptables -A FORWARD -i tun0 -o ens4 -j ACCEPT
          sudo iptables -A FORWARD -i tun0 -o et1 -j ACCEPT
          sudo iptables -A FORWARD -i ens4 -o tun0 -m state --state RELATED,ESTABLISHED -j ACCEPT
          sudo iptables -A FORWARD -i et1 -o tun0 -m state --state RELATED,ESTABLISHED -j ACCEPT
          sudo netfilter-persistent save
      register: iptables_out
      changed_when: iptables_out.rc

