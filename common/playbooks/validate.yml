---
- name: Validate Network State (ANTA)
  hosts: "{{ target_hosts }}"
  connection: local
  gather_facts: false

  tasks:
    - name: Import Global Vars
      ansible.builtin.include_vars: "{{ item }}"
      with_items:
        - "../global_vars/global_dc_vars.yml"

    - name: Run ANTA on EOS devices
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
